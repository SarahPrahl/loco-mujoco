wandb:
  project: "deepmimic"

experiment:
  task_factory:
    name: ImitationFactory
    params:
      custom_dataset_conf:
        paths:
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/27_07_2026_fixed/2_merged_filtered_v2.npz
  env_params:
    env_name: MjxUnitreeG1Inspire
    use_mjwarp: True
    nconmax: 32000
    headless: True
    horizon: 3000
    terminal_state_type: RootPoseTrajTerminalStateHandler
    terminal_state_params:
      root_height_margin: 0.15
      root_rot_margin_degrees: 25.0
      max_root_pos_deviation: 0.2
    goal_type: GoalTrajMimic
    goal_params:
      visualize_goal: true
    control_type: ${control_config.position_control.control_type}
    control_params: ${control_config.position_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_exp: 5
      qvel_w_exp: 2
      rpos_w_exp: 5
      rquat_w_exp: 10
      rvel_w_exp: 0.5
      qpos_w_sum: 0.5
      qvel_w_sum: 0.2
      rpos_w_sum: 0.5
      rquat_w_sum: 0.3
      rvel_w_sum: 0.2
      joints_for_mimic:
        - root
        - left_hip_pitch_joint
        - left_hip_roll_joint
        - left_hip_yaw_joint
        - left_knee_joint
        - left_ankle_pitch_joint
        - left_ankle_roll_joint
        - right_hip_pitch_joint
        - right_hip_roll_joint
        - right_hip_yaw_joint
        - right_knee_joint
        - right_ankle_pitch_joint
        - right_ankle_roll_joint
        - waist_yaw_joint
        - waist_roll_joint
        - waist_pitch_joint
        - left_shoulder_pitch_joint
        - left_shoulder_roll_joint
        - left_shoulder_yaw_joint
        - left_elbow_joint
        - left_wrist_roll_joint
        - left_wrist_pitch_joint
        - left_wrist_yaw_joint
        - right_shoulder_pitch_joint
        - right_shoulder_roll_joint
        - right_shoulder_yaw_joint
        - right_elbow_joint
        - right_wrist_roll_joint
        - right_wrist_pitch_joint
        - right_wrist_yaw_joint
      sites_for_mimic:
        - upper_body_mimic
        - left_hand_mimic
        - left_foot_mimic
        - right_hand_mimic
        - right_foot_mimic
  hidden_layers: [512, 256]
  lr: 1e-4
  num_envs: 2048
  num_steps: 200
  total_timesteps: 400e6
  update_epochs: 4
  proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.1
  learnable_std: true
  ent_coef: 0.003
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: true
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1  # will automatically take seeds from 1 to n_seeds
  vmap_across_seeds: true
  validation:
    active: true
    num_steps: 300
    num_envs: 100
    num: 10 # set to 0 to disable validation
    # if none of the following is set, only the mean reward and episode length is logged
    quantities: # quantities to be used for the distance measures below
      - JointPosition
      - JointVelocity
      - RelSitePosition
      - RelSiteVelocity
      - RelSiteOrientation
    measures:
      - EuclideanDistance
      - DynamicTimeWarping
      - DiscreteFrechetDistance
    rel_site_names:
      - upper_body_mimic
      - left_hand_mimic
      - left_foot_mimic
      - right_hand_mimic
      - right_foot_mimic
    joints_to_ignore:
      - pelvis_tx
      - pelvis_tz
      - pelvis_ty
      - pelvis_tilt
      - pelvis_list
      - pelvis_rotation

# Define control subconfigs
# G1 (Inspire hands) actuator order: 12 leg (L hip p/r/y, L knee, L ankle p/r,
# R hip p/r/y, R knee, R ankle p/r), 3 waist (yaw/roll/pitch), 4 L arm
# (shoulder p/r/y, elbow), 3 L wrist, 12 L fingers, 4 R arm, 3 R wrist, 12 R fingers.
control_config:
  position_control:
    control_type: DefaultControl
    control_params:
      center_on_default_pose: true

  torque_control:
    control_type: DefaultControl
    control_params: