wandb:
  project: "deepmimic"

experiment:
  task_factory:
    name: ImitationFactory
    params:
      custom_dataset_conf:
        paths:
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/1_merged_filtered.npz
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/2_merged_filtered.npz
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/3_merged_filtered.npz
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/4_merged_filtered.npz
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/5_merged_filtered.npz
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/6_merged_filtered.npz
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/7_merged_filtered.npz
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/8_merged_filtered.npz
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/9_merged_filtered.npz
          - /home/andy/work/gitlab/mujoco/mocap_data/npz/06_07_2026/10_merged_filtered.npz
  env_params:
    env_name: MjxUnitreeG1Inspire
    # disable_arms: True
    use_mjwarp: false
    nconmax: 16000
    headless: True
    horizon: 1000
    terminal_state_type: RootPoseTrajTerminalStateHandler
    terminal_state_params:
      root_height_margin: 0.35
      root_rot_margin_degrees: 45.0
    goal_type: GoalTrajMimic  ### Problem!!! Increases the observation space from 60 to 513. Issues with conversion to SB3 model.
    goal_params:
      visualize_goal: false
    control_type: ${control_config.position_control.control_type}
    control_params: ${control_config.position_control.control_params}
    reward_type: MimicReward
    reward_params:
      qpos_w_sum: 0.4
      qvel_w_sum: 0.2
      rpos_w_sum: 0.5
      rquat_w_sum: 0.3
      rvel_w_sum: 0.1
      rpos_w_exp: 20
      action_rate_coeff: 0.0
      joint_torque_coeff: 0.0
      joint_acc_coeff: 0.0
      sites_for_mimic:
        - upper_body_mimic
        - left_hand_mimic
        - left_thumb_mimic
        - left_index_mimic
        - left_middle_mimic
        - left_ring_mimic
        - left_little_mimic
        - left_foot_mimic
        - right_hand_mimic
        - right_thumb_mimic
        - right_index_mimic
        - right_middle_mimic
        - right_ring_mimic
        - right_little_mimic
        - right_foot_mimic
  hidden_layers: [512, 256]
  lr: 1e-4
  num_envs: 2048
  num_steps: 200
  total_timesteps: 50e6
  update_epochs: 4
  proportion_env_reward: 0.0
  num_minibatches: 32
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  init_std: 0.1
  learnable_std: false
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  activation: tanh
  anneal_lr: false
  weight_decay: 0.0
  normalize_env: true
  debug: false
  n_seeds: 1  # will automatically take seeds from 1 to n_seeds
  vmap_across_seeds: true
  validation:
    active: true
    num_steps: 100
    num_envs: 100
    num: 10 # set to 0 to disable validation
    # if none of the following is set, only the mean reward and episode length is logged
    quantities: # quantities to be used for the distance measures below
      - JointPosition
      - JointVelocity
      - RelSitePosition
      - RelSiteVelocity
      - RelSiteOrientation
    measures:
      - EuclideanDistance
      - DynamicTimeWarping
      - DiscreteFrechetDistance
    rel_site_names:
      - upper_body_mimic
      - left_hand_mimic
      - left_foot_mimic
      - right_hand_mimic
      - right_foot_mimic
    joints_to_ignore:
      - ball_joint
      - pelvis_tx
      - pelvis_tz
      - pelvis_ty
      - pelvis_tilt
      - pelvis_list
      - pelvis_rotation

